name: Build Car Media Hub APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch Head Unit Certificate
        run: |
          curl -L -o /tmp/official.apk "https://github.com/YegorkaPomidorka/headswap/releases/download/v4.3.0/headswap-4.3.0.apk"
          unzip -o /tmp/official.apk "assets/aa/hur/*" -d android/app/src/main/

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarMediaHub-APK
          path: android/app/build/outputs/apk/debug/*.apk
