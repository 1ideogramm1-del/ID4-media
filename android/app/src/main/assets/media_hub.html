<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ID4 Media</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  :root {
    --bg: #050b14;
    --glass: rgba(18, 34, 58, 0.72);
    --border: rgba(0, 212, 255, 0.18);
    --accent: #00d4ff;
    --accent2: #6c5ce7;
    --text: #eef6ff;
    --muted: #8aa7c7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  body {
    background: radial-gradient(circle at top right, #0d2240 0%, #050b14 60%);
    color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    background: rgba(8, 17, 30, 0.85); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .logo { font-size: 20px; font-weight: 900; letter-spacing: 1px; background: linear-gradient(90deg, #00d4ff, #7ef9ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .clock { font-size: 15px; font-weight: 700; color: var(--muted); margin-left: auto; background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 20px; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; }
  .tab {
    background: var(--glass); color: var(--muted); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 14px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; white-space: nowrap;
  }
  .tab.active { background: linear-gradient(135deg, #00d4ff, #0088cc); color: #04101d; border-color: transparent; box-shadow: 0 0 16px rgba(0,212,255,0.35); }
  .tab.aa { background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: none; }
  main { flex: 1; display: flex; overflow: hidden; position: relative; }
  .panel { display: none; width: 100%; height: 100%; flex-direction: column; }
  .panel.active { display: flex; }
  .bar { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; align-items: center; }
  .chip {
    background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .chip:active { background: var(--accent); color: #04101d; }
  input {
    flex: 1; min-width: 150px; background: rgba(255,255,255,0.07); border: 1px solid var(--border);
    color: #fff; padding: 10px 14px; border-radius: 14px; font-size: 14px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 12px; padding: 8px 16px 16px; overflow-y: auto; flex: 1; }
  .card {
    background: var(--glass); border: 1px solid var(--border); border-radius: 18px;
    padding: 14px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; min-height: 92px;
    transition: transform 0.15s, border-color 0.2s; position: relative;
  }
  .card:active { transform: scale(0.97); }
  .card.playing { border-color: var(--accent); box-shadow: 0 0 18px rgba(0,212,255,0.25); background: rgba(0,212,255,0.12); }
  .card-title { font-size: 15px; font-weight: 700; line-height: 1.3; padding-left: 24px; }
  .card-sub { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .fav { position: absolute; top: 10px; left: 10px; background: none; border: none; font-size: 16px; cursor: pointer; opacity: 0.6; }
  .fav.on { opacity: 1; }
  video { width: 100%; max-height: 48vh; background: #000; border-bottom: 1px solid var(--border); }
  iframe { width: 100%; height: 100%; border: none; background: #000; }
  .dock {
    background: rgba(10, 22, 40, 0.92); backdrop-filter: blur(16px);
    padding: 10px 16px; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--border);
  }
  #nowPlaying { flex: 1; font-weight: 700; color: var(--accent); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  audio { height: 34px; max-width: 220px; }
</style>
</head>
<body>
<header>
  <div class="logo">ID4 MEDIA</div>
  <div class="clock" id="clock">--:--</div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('radio', this)">📻 راديو</button>
    <button class="tab" onclick="showTab('iptv', this)">📺 IPTV</button>
    <button class="tab" onclick="showTab('youtube', this)">▶️ يوتيوب</button>
    <button class="tab" onclick="showTab('favs', this); renderFavs();">❤️ المفضلة</button>
    <button class="tab aa" onclick="if(window.Android) Android.openBridge();">🚗 Android Auto</button>
  </div>
</header>

<main>
  <section id="radio" class="panel active">
    <div class="bar">
      <button class="chip" onclick="loadRadio('Jordan')">🇯🇴 الأردن</button>
      <button class="chip" onclick="loadRadio('Egypt')">🇪🇬 مصر</button>
      <button class="chip" onclick="loadRadio('Saudi Arabia')">🇸🇦 السعودية</button>
      <button class="chip" onclick="loadRadio('United Arab Emirates')">🇦🇪 الإمارات</button>
      <button class="chip" onclick="loadRadio('top')">🌍 عالمي</button>
      <input id="radioSearch" placeholder="ابحث عن إذاعة..." onkeydown="if(event.key==='Enter') searchRadio()">
    </div>
    <div id="radioGrid" class="grid"></div>
  </section>

  <section id="iptv" class="panel">
    <div class="bar">
      <input id="m3uUrl" placeholder="رابط M3U8 مباشر خاص بك...">
      <button class="chip" onclick="playCustomStream()">تشغيل</button>
      <button class="chip" onclick="loadFreeIptv()">تحديث القنوات</button>
    </div>
    <video id="tvPlayer" controls playsinline></video>
    <div id="tvGrid" class="grid"></div>
  </section>

  <section id="youtube" class="panel">
    <iframe src="https://m.youtube.com" allow="autoplay; fullscreen; encrypted-media"></iframe>
  </section>

  <section id="favs" class="panel">
    <div id="favGrid" class="grid"></div>
  </section>
</main>

<div class="dock">
  <div id="nowPlaying">✨ جاهز للتشغيل — ID4 Media</div>
  <audio id="audioPlayer" controls></audio>
</div>

<script>
let hls = null;
let favs = JSON.parse(localStorage.getItem('id4_favs') || '[]');

function updateClock() {
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
setInterval(updateClock, 1000); updateClock();

function showTab(id, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (btn) btn.classList.add('active');
}

function toggleFav(item, e) {
  e.stopPropagation();
  const idx = favs.findIndex(f => f.url === item.url);
  if (idx >= 0) favs.splice(idx, 1); else favs.push(item);
  localStorage.setItem('id4_favs', JSON.stringify(favs));
  e.target.classList.toggle('on');
}

function isFav(url) { return favs.some(f => f.url === url); }

async function loadRadio(country) {
  const grid = document.getElementById('radioGrid');
  grid.innerHTML = '<div style="padding:20px;color:#8aa7c7">جاري تحميل المحطات...</div>';
  const url = country === 'top'
    ? 'https://de1.api.radio-browser.info/json/stations/topvote/40'
    : `https://de1.api.radio-browser.info/json/stations/bycountry/${encodeURIComponent(country)}?limit=40&order=votes&reverse=true`;
  try {
    const res = await fetch(url);
    renderRadio(await res.json());
  } catch { grid.innerHTML = '<div style="padding:20px">تأكد من اتصال الإنترنت.</div>'; }
}

async function searchRadio() {
  const q = document.getElementById('radioSearch').value.trim();
  if (!q) return;
  const res = await fetch(`https://de1.api.radio-browser.info/json/stations/byname/${encodeURIComponent(q)}?limit=30`);
  renderRadio(await res.json());
}

function playRadio(name, url, card) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('playing'));
  if (card) card.classList.add('playing');
  const a = document.getElementById('audioPlayer');
  a.src = url; a.play();
  document.getElementById('nowPlaying').textContent = '📻 ' + name;
}

function renderRadio(list) {
  const grid = document.getElementById('radioGrid');
  grid.innerHTML = '';
  list.filter(s => s.url_resolved).forEach(s => {
    const item = { type: 'radio', name: s.name, url: s.url_resolved };
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = `<button class="fav ${isFav(item.url)?'on':''}">❤️</button><div class="card-title">${s.name}</div><div class="card-sub">${s.country || ''}</div>`;
    d.querySelector('.fav').onclick = (e) => toggleFav(item, e);
    d.onclick = () => playRadio(s.name, s.url_resolved, d);
    grid.appendChild(d);
  });
}

function playHls(url, name) {
  const video = document.getElementById('tvPlayer');
  if (hls) { hls.destroy(); hls = null; }
  if (Hls.isSupported()) {
    hls = new Hls(); hls.loadSource(url); hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
  } else { video.src = url; video.play(); }
  document.getElementById('nowPlaying').textContent = '📺 ' + name;
}

function playCustomStream() {
  const u = document.getElementById('m3uUrl').value.trim();
  if (u) playHls(u, 'بث مخصص');
}

async function loadFreeIptv() {
  const grid = document.getElementById('tvGrid');
  grid.innerHTML = '<div style="padding:20px;color:#8aa7c7">جاري تحميل القنوات...</div>';
  try {
    const res = await fetch('https://iptv-org.github.io/iptv/languages/ara.m3u');
    const lines = (await res.text()).split('\n');
    const channels = [];
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].startsWith('#EXTINF:')) {
        const name = lines[i].split(',').pop().trim();
        const url = (lines[i + 1] || '').trim();
        if (url.startsWith('http')) channels.push({ type: 'tv', name, url });
      }
    }
    grid.innerHTML = '';
    channels.slice(0, 60).forEach(ch => {
      const d = document.createElement('div');
      d.className = 'card';
      d.innerHTML = `<button class="fav ${isFav(ch.url)?'on':''}">❤️</button><div class="card-title">📺 ${ch.name}</div><div class="card-sub">بث مباشر</div>`;
      d.querySelector('.fav').onclick = (e) => toggleFav(ch, e);
      d.onclick = () => playHls(ch.url, ch.name);
      grid.appendChild(d);
    });
  } catch { grid.innerHTML = '<div style="padding:20px">تأكد من اتصال الإنترنت.</div>'; }
}

function renderFavs() {
  const grid = document.getElementById('favGrid');
